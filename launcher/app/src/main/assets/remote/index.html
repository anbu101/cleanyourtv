<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="TV Remote"/>
  <meta name="theme-color" content="#0A0C14"/>
  <link rel="manifest" href="/manifest.json"/>
  <title>TV Remote</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0A0C14;--surface:#12151F;--raise:#181B28;
      --border:rgba(255,255,255,0.07);--text:#FFF;--muted:rgba(255,255,255,0.38);
      --accent:#4DAE6D;--red:#E05252;--r:14px;
      --sd:rgba(0,0,0,0.72);--sl:rgba(255,255,255,0.055);
    }
    html,body{height:100%;width:100%;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
      -webkit-tap-highlight-color:transparent;user-select:none;
      overflow:hidden;overscroll-behavior:none;}
    body{display:flex;flex-direction:column;
      padding: 14px 20px 38px 20px;
      gap:8px;}
    button{touch-action:manipulation;-webkit-user-select:none;cursor:pointer;font-family:inherit;border:none;}

    /* Landscape overlay — iOS can't lock orientation via JS */
    #landscape-warn{display:none;position:fixed;inset:0;background:#0A0C14;z-index:9999;
      align-items:center;justify-content:center;flex-direction:column;gap:14px;}
    @media(orientation:landscape){#landscape-warn{display:flex;}}
    #landscape-warn .lw-icon{font-size:52px;transform:rotate(-90deg);}
    #landscape-warn p{font-size:15px;color:var(--muted);text-align:center;padding:0 32px;}

    /* 3D base */
    .btn3d{
      background:linear-gradient(160deg,var(--raise) 0%,var(--surface) 100%);
      box-shadow:3px 3px 7px var(--sd),-1px -1px 4px var(--sl),inset 0 1px 0 rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.06);
      transition:box-shadow .1s,transform .1s;}
    .btn3d:active{box-shadow:1px 1px 3px var(--sd),inset 0 1px 3px rgba(0,0,0,.45);transform:translateY(2px) scale(0.96);}

    /* Header */
    .hdr{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding:0 2px;position:relative;}
    .hdr-left{display:flex;align-items:center;gap:7px;}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:background .4s,box-shadow .4s;}
    .dot.on{background:var(--accent);box-shadow:0 0 8px var(--accent);}
    .dot.off{background:var(--red);}
    .hdr-label{font-size:12px;color:var(--muted);}
    .hdr-title{font-size:16px;font-weight:700;letter-spacing:-.3px;position:absolute;left:50%;transform:translateX(-50%);}
    .hdr-right{display:flex;align-items:center;gap:8px;}
    .power-btn{
      width:36px;height:36px;border-radius:50%;
      background:linear-gradient(145deg,#2a1515,#1a0e0e);
      box-shadow:3px 3px 7px rgba(0,0,0,.75),-1px -1px 4px rgba(255,80,80,.07),inset 0 1px 0 rgba(255,100,100,.08);
      border:1px solid rgba(224,82,82,.25);color:var(--red);font-size:16px;
      display:flex;align-items:center;justify-content:center;transition:box-shadow .1s,transform .1s;}
    .power-btn:active{box-shadow:1px 1px 3px rgba(0,0,0,.75),inset 0 1px 3px rgba(0,0,0,.5);transform:translateY(2px) scale(0.94);}
    .sfx-btn{
      width:32px;height:32px;border-radius:50%;
      background:linear-gradient(145deg,var(--raise),var(--surface));
      box-shadow:2px 2px 5px var(--sd),-1px -1px 3px var(--sl),inset 0 1px 0 rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.09);color:var(--muted);
      display:flex;align-items:center;justify-content:center;transition:box-shadow .1s,transform .1s,color .2s,border-color .2s;}
    .sfx-btn:active{box-shadow:1px 1px 2px var(--sd),inset 0 1px 3px rgba(0,0,0,.4);transform:translateY(1px) scale(0.94);}
    .sfx-btn.on{color:var(--accent);border-color:rgba(77,174,109,.3);}

    /* ── App shortcuts 2×3 — icon fills the whole button ── */
    .apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex-shrink:0;margin-top:4px;}
    .app-btn{
      height:78px;border-radius:var(--r);
      display:flex;align-items:center;justify-content:center;
      box-shadow:3px 3px 8px var(--sd),-1px -1px 4px var(--sl),inset 0 1px 0 rgba(255,255,255,.12);
      border:none;transition:box-shadow .1s,transform .1s;overflow:hidden;position:relative;}
    .app-btn:active{box-shadow:1px 1px 3px var(--sd),inset 0 2px 5px rgba(0,0,0,.45);transform:translateY(2px) scale(0.95);}
    .app-btn svg,.app-btn span.ltr{pointer-events:none;}

    /* Brand colours */
    .app-yt    {background:#FF0000;}
    .app-nflx  {background:#141414;border:1px solid #E50914;}
    .app-prime {background:#00A8E0;}
    .app-hstar {background:linear-gradient(135deg,#1B5FCB,#7B2FF7);}
    .app-livetv{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);}
    .app-spotify{background:#1DB954;}
    .app-mirror{background:linear-gradient(135deg,#0d1b2a,#1a2744);border:1px solid rgba(100,149,237,.3);grid-column:1/-1;height:44px;}

    /* N logo for Netflix */
    .nflx-n{font-size:38px;font-weight:900;font-style:italic;color:#E50914;
      text-shadow:2px 0 0 rgba(0,0,0,.5);font-family:Georgia,serif;line-height:1;}

    /* Spotify bars */
    .spotify-icon{display:flex;flex-direction:column;gap:4px;align-items:center;}
    .sp-bar{height:4px;border-radius:2px;background:#000;}

    /* Mode toggle */
    .mode-row{display:flex;background:var(--surface);border-radius:10px;padding:3px;gap:3px;flex-shrink:0;border:1px solid var(--border);}
    .mode-btn{flex:1;height:28px;border-radius:7px;background:transparent;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.2px;transition:background .15s,color .15s;}
    .mode-btn.active{background:var(--raise);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.4);}

    /* Middle row */
    .middle{display:flex;align-items:center;gap:10px;flex:1;min-height:0;}
    .dpad-wrap{flex:1;display:flex;justify-content:center;align-items:center;}

    /* Trackpad */
    .tp-wrap{flex:1;display:flex;justify-content:center;align-items:center;}
    .trackpad{
      width:100%;aspect-ratio:1;border-radius:24px;
      background:linear-gradient(145deg,var(--raise),var(--surface));
      box-shadow:4px 4px 10px var(--sd),-2px -2px 6px var(--sl),inset 0 1px 0 rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.06);
      position:relative;overflow:hidden;touch-action:none;
      display:flex;align-items:center;justify-content:center;}
    .trackpad::before{
      content:'';position:absolute;inset:0;
      background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.03) 0%,transparent 70%);
      pointer-events:none;}
    .tp-hint{font-size:11px;color:var(--muted);text-align:center;pointer-events:none;line-height:1.7;opacity:.55;}
    .tp-dot{
      position:absolute;width:24px;height:24px;border-radius:50%;
      background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);
      transform:translate(-50%,-50%);pointer-events:none;
      transition:opacity .15s;opacity:0;}
    .dpad{
      display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
      width:min(68vw,260px);aspect-ratio:1;
      background:linear-gradient(145deg,var(--raise),var(--surface));
      box-shadow:4px 4px 10px var(--sd),-2px -2px 6px var(--sl),inset 0 1px 0 rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.06);border-radius:50%;overflow:hidden;}
    .dp{background:transparent;border:none;color:var(--text);display:flex;align-items:center;justify-content:center;font-size:13px;transition:background .08s;}
    .dp:active{background:rgba(255,255,255,.16);}
    .dp.corner{pointer-events:none;}
    .dp-ok{
      background:linear-gradient(145deg,rgba(77,174,109,.18),rgba(77,174,109,.07));
      border-radius:50%;margin:11px;font-size:13px;font-weight:800;letter-spacing:.8px;
      grid-column:2;grid-row:2;box-shadow:inset 0 1px 0 rgba(77,174,109,.2);transition:background .08s,box-shadow .08s;}
    .dp-ok:active{background:rgba(77,174,109,.38);box-shadow:inset 0 2px 5px rgba(0,0,0,.4);}
    .dp svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none;}

    /* Vertical volume */
    .vol-col{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;width:52px;}
    .vol-icon{font-size:18px;line-height:1;}
    .vol-num{font-size:13px;color:var(--muted);font-weight:600;}
    .vol-track{flex:1;display:flex;align-items:center;justify-content:center;width:52px;min-height:144px;}
    input[type="range"].vert{
      writing-mode:vertical-lr;direction:rtl;-webkit-appearance:slider-vertical;
      width:52px;height:100%;min-height:144px;max-height:216px;
      outline:none;cursor:pointer;background:transparent;}
    input[type="range"].vert::-webkit-slider-runnable-track{
      width:12px;border-radius:6px;
      background:linear-gradient(to bottom,rgba(255,255,255,.13) var(--fi,0%),var(--accent) var(--fi,0%));}
    input[type="range"].vert::-webkit-slider-thumb{
      -webkit-appearance:none;width:32px;height:32px;border-radius:50%;
      background:linear-gradient(145deg,#fff,#ccc);
      box-shadow:0 2px 10px rgba(0,0,0,.65),0 0 0 3px rgba(77,174,109,.35);
      margin-left:-10px;cursor:grab;}
    input[type="range"].vert:active::-webkit-slider-thumb{cursor:grabbing;}

    /* Nav row */
    .nav-row{display:flex;gap:7px;flex-shrink:0;}
    .nav-btn{flex:1;height:48px;border-radius:var(--r);color:var(--text);font-size:12px;font-weight:600;
      display:flex;align-items:center;justify-content:center;gap:5px;}
    .nav-btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none;}
    .nav-btn.home{
      background:linear-gradient(160deg,rgba(77,174,109,.22),rgba(77,174,109,.08));
      box-shadow:3px 3px 7px var(--sd),-1px -1px 4px rgba(77,174,109,.06),inset 0 1px 0 rgba(77,174,109,.14);
      border:1px solid rgba(77,174,109,.24);color:var(--accent);transition:box-shadow .1s,transform .1s;}
    .nav-btn.home:active{box-shadow:1px 1px 3px var(--sd),inset 0 1px 3px rgba(0,0,0,.4);transform:translateY(2px) scale(0.95);}

    /* Media */
    .media-row{display:flex;gap:7px;flex-shrink:0;}
    .med-btn{flex:1;height:54px;border-radius:var(--r);color:var(--text);
      display:flex;align-items:center;justify-content:center;}
    .med-btn svg{width:22px;height:22px;fill:currentColor;stroke:none;}
    .med-btn.play{
      background:linear-gradient(160deg,rgba(77,174,109,.26),rgba(77,174,109,.1));
      box-shadow:3px 3px 7px var(--sd),-1px -1px 4px rgba(77,174,109,.07),inset 0 1px 0 rgba(77,174,109,.15);
      border:1px solid rgba(77,174,109,.26);color:var(--accent);transition:box-shadow .1s,transform .1s;}
    .med-btn.play:active{box-shadow:1px 1px 3px var(--sd),inset 0 1px 3px rgba(0,0,0,.4);transform:translateY(2px) scale(0.95);}

    /* Text input */
    .text-row{display:flex;gap:8px;flex-shrink:0;}
    .text-row input{flex:1;height:44px;background:var(--surface);border:1px solid var(--border);
      border-radius:var(--r);color:var(--text);font-size:14px;padding:0 14px;outline:none;
      -webkit-appearance:none;box-shadow:inset 2px 2px 5px rgba(0,0,0,.4);transition:border-color .15s;}
    .text-row input:focus{border-color:rgba(77,174,109,.5);}
    .text-row input::placeholder{color:var(--muted);}
    .send-btn{width:44px;height:44px;
      background:linear-gradient(145deg,#5dc97d,#3a9a57);
      box-shadow:3px 3px 7px var(--sd),inset 0 1px 0 rgba(255,255,255,.2);
      border-radius:var(--r);color:#fff;display:flex;align-items:center;justify-content:center;
      flex-shrink:0;transition:box-shadow .1s,transform .1s;}
    .send-btn:active{box-shadow:1px 1px 3px var(--sd),inset 0 1px 3px rgba(0,0,0,.4);transform:translateY(2px) scale(0.94);}
    .mic-btn{width:44px;height:44px;
      background:linear-gradient(145deg,var(--raise),var(--surface));
      box-shadow:3px 3px 7px var(--sd),-1px -1px 4px var(--sl),inset 0 1px 0 rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.09);border-radius:var(--r);color:var(--muted);
      display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:box-shadow .1s,transform .1s,color .15s;}
    .mic-btn:active{box-shadow:1px 1px 3px var(--sd),inset 0 1px 3px rgba(0,0,0,.4);transform:translateY(2px) scale(0.94);color:#fff;}
    .mic-btn.listening{color:var(--accent);border-color:rgba(77,174,109,.4);box-shadow:0 0 0 3px rgba(77,174,109,.2),3px 3px 7px var(--sd);}
    /* Cast file button (photo/video icon beside text box) */
    .cast-file-btn{width:44px;height:44px;
      background:linear-gradient(145deg,var(--raise),var(--surface));
      box-shadow:3px 3px 7px var(--sd),-1px -1px 4px var(--sl),inset 0 1px 0 rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.09);border-radius:var(--r);color:var(--muted);
      display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:box-shadow .1s,transform .1s,color .15s;}
    .cast-file-btn:active{box-shadow:1px 1px 3px var(--sd),inset 0 1px 3px rgba(0,0,0,.4);transform:translateY(2px) scale(0.94);}
    .cast-file-btn.uploading{color:var(--accent);}
    /* Thin upload progress bar below text row */
    .cast-prog{height:4px;background:var(--surface);border-radius:2px;overflow:hidden;flex-shrink:0;margin-top:-4px;display:none;}
    .cast-prog-fill{height:100%;background:var(--accent);width:0%;transition:width .15s;}

    /* Sleep timer button */
    .sleep-btn{height:44px;border-radius:var(--r);color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.3px;
      background:linear-gradient(145deg,var(--raise),var(--surface));
      box-shadow:3px 3px 7px var(--sd),-1px -1px 4px var(--sl),inset 0 1px 0 rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.09);
      display:flex;align-items:center;justify-content:center;gap:5px;padding:0 10px;
      flex:1;transition:box-shadow .1s,transform .1s,color .2s,border-color .2s;}
    .sleep-btn:active{box-shadow:1px 1px 3px var(--sd),inset 0 1px 3px rgba(0,0,0,.4);transform:translateY(2px) scale(0.95);}
    .sleep-btn.active{color:#F59E0B;border-color:rgba(245,158,11,.35);}
    /* TV switcher */
    .tv-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center;padding-bottom:30px;}
    .tv-modal.open{display:flex;}
    .tv-sheet{background:var(--surface);border-radius:18px 18px 18px 18px;padding:18px;width:min(92vw,380px);border:1px solid var(--border);}
    .tv-sheet h3{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;}
    .tv-item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px;cursor:pointer;transition:background .1s;}
    .tv-item:active,.tv-item.selected{background:var(--raise);}
    .tv-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;}
    .tv-dot.on{background:var(--accent);box-shadow:0 0 6px var(--accent);}
    .tv-name{flex:1;font-size:14px;font-weight:600;}
    .tv-ip{font-size:11px;color:var(--muted);}
    .tv-del{color:var(--red);font-size:18px;padding:4px 8px;border-radius:6px;background:transparent;border:none;cursor:pointer;}
    .tv-add{display:flex;gap:8px;margin-top:12px;}
    .tv-add input{flex:1;height:38px;background:var(--bg);border:1px solid var(--border);border-radius:10px;
      color:var(--text);font-size:13px;padding:0 12px;outline:none;}
    .tv-add-btn{height:38px;padding:0 14px;background:linear-gradient(145deg,#5dc97d,#3a9a57);
      border-radius:10px;border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;}
    /* Toast */
    #toast{position:fixed;bottom:calc(env(safe-area-inset-bottom)+24px);left:50%;
      transform:translateX(-50%) translateY(64px);
      background:rgba(20,24,32,.96);border:1px solid var(--border);border-radius:20px;
      padding:7px 18px;font-size:12px;color:var(--muted);
      transition:transform .22s cubic-bezier(.34,1.56,.64,1);
      pointer-events:none;white-space:nowrap;z-index:99;}
    #toast.show{transform:translateX(-50%) translateY(0);}
  </style>
</head>
<body>

  <!-- Portrait guard (iOS can't lock via JS) -->
  <div id="landscape-warn">
    <div class="lw-icon">📱</div>
    <p>Please rotate your phone to portrait mode</p>
  </div>

  <!-- Header -->
  <div class="hdr">
    <div class="hdr-left">
      <div class="dot" id="dot"></div>
      <span class="hdr-label" id="stlbl">Connecting</span>
    </div>
    <span class="hdr-title">Remote</span>
    <div class="hdr-right">
      <button class="sfx-btn" id="sfx-btn" onclick="toggleSfx()" title="Sound feedback">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path id="sfx-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
      <button class="sfx-btn" onclick="openTvModal()" title="Switch TV" style="width:32px;height:32px;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
      </button>
      <button class="power-btn" onclick="htap('power')">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v7"/><path d="M18.5 5.5a9 9 0 1 1-13 0"/></svg>
      </button>
    </div>
  </div>

  <!-- Apps 2×3 — icon fills the whole button -->
  <div class="apps">

    <!-- YouTube -->
    <button class="app-btn app-yt" onclick="hlaunch('com.google.android.youtube.tv')">
      <svg viewBox="0 0 80 56" width="72" height="50">
        <rect width="80" height="56" rx="12" fill="#FF0000"/>
        <polygon points="32,14 32,42 58,28" fill="white"/>
      </svg>
    </button>

    <!-- Netflix -->
    <button class="app-btn app-nflx" onclick="hlaunch('com.netflix.ninja')">
      <span class="nflx-n">N</span>
    </button>

    <!-- Prime Video -->
    <button class="app-btn app-prime" onclick="hlaunch('com.amazon.amazonvideo.livingroom')">
      <svg viewBox="0 0 80 56" width="72" height="50">
        <text x="6" y="38" font-size="22" font-weight="900" fill="white" font-family="-apple-system,sans-serif">prime</text>
        <text x="6" y="52" font-size="12" font-weight="400" fill="rgba(255,255,255,0.8)" font-family="-apple-system,sans-serif">video</text>
        <polygon points="64,22 64,40 76,31" fill="white"/>
      </svg>
    </button>

    <!-- Hotstar -->
    <button class="app-btn app-hstar" onclick="hlaunch('in.startv.hotstar')">
      <svg viewBox="0 0 80 56" width="72" height="50">
        <text x="8" y="28" font-size="13" font-weight="800" fill="white" font-family="-apple-system,sans-serif">hot</text>
        <text x="8" y="46" font-size="13" font-weight="800" fill="#FFD700" font-family="-apple-system,sans-serif">star</text>
        <polygon points="62,12 65,22 76,22 67,28 70,38 62,32 54,38 57,28 48,22 59,22" fill="#FFD700"/>
      </svg>
    </button>

    <!-- Live TV -->
    <button class="app-btn app-livetv" onclick="hlaunch('com.heytap.tv.livetv')">
      <svg viewBox="0 0 80 56" width="72" height="50">
        <rect x="10" y="18" width="44" height="30" rx="3" fill="none" stroke="#4fc3f7" stroke-width="2.5"/>
        <rect x="14" y="22" width="36" height="22" rx="2" fill="rgba(79,195,247,0.15)"/>
        <line x1="32" y1="48" x2="32" y2="54" stroke="#4fc3f7" stroke-width="2"/>
        <line x1="48" y1="48" x2="48" y2="54" stroke="#4fc3f7" stroke-width="2"/>
        <line x1="28" y1="54" x2="52" y2="54" stroke="#4fc3f7" stroke-width="2"/>
        <circle cx="62" cy="16" r="4" fill="#FF4444"/>
        <text x="56" y="32" font-size="9" font-weight="800" fill="white" font-family="-apple-system,sans-serif">LIVE</text>
      </svg>
    </button>

    <!-- Spotify -->
    <button class="app-btn app-spotify" onclick="hlaunch('com.spotify.tv.android')">
      <svg viewBox="0 0 80 56" width="72" height="50">
        <circle cx="40" cy="28" r="22" fill="#1DB954"/>
        <path d="M26 22 Q40 16 54 21" stroke="black" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Upload progress (hidden until a file is uploading) -->
  <div class="cast-prog" id="cast-prog"><div class="cast-prog-fill" id="cast-prog-fill"></div></div>

  <!-- TV switcher modal -->
  <div class="tv-modal" id="tv-modal" onclick="if(event.target===this)closeTvModal()">
    <div class="tv-sheet">
      <h3>Your TVs</h3>
      <div id="tv-list"></div>
      <div class="tv-add">
        <input id="tv-name-in" placeholder="Name (e.g. Bedroom)" type="text"/>
        <input id="tv-ip-in" placeholder="192.168.1.x" type="text" inputmode="decimal"/>
        <button class="tv-add-btn" onclick="addTv()">Add</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ── Haptic / audio click ──────────────────────────────────────────────────
    // Android: native vibration. iOS (no vibrate API): Web Audio click if sfx ON.
    let sfxOn = localStorage.getItem('sfx') !== '0';
    let _actx = null;
    function getACtx(){ if(!_actx) _actx = new (window.AudioContext||window.webkitAudioContext)(); return _actx; }
    function audioClick(){
      try{
        const ctx = getACtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.value = 800;
        gain.gain.setValueAtTime(0.05, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.04);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.04);
      }catch(e){}
    }
    function haptic(){
      if(typeof navigator.vibrate === 'function'){ navigator.vibrate(50); return; }
      if(sfxOn) audioClick();
    }
    function toggleSfx(){
      sfxOn = !sfxOn;
      localStorage.setItem('sfx', sfxOn ? '1' : '0');
      updateSfxBtn();
      if(sfxOn) audioClick(); // preview
    }
    function updateSfxBtn(){
      const btn = document.getElementById('sfx-btn');
      const wave = document.getElementById('sfx-wave');
      btn.classList.toggle('on', sfxOn);
      wave.style.display = sfxOn ? '' : 'none';
    }
    updateSfxBtn();

    // ── Fetch with timeout ────────────────────────────────────────────────────
    function fetchT(url,opts,ms=3000){
      const c=new AbortController();
      const t=setTimeout(()=>c.abort(),ms);
      return fetch(url,{...opts,signal:c.signal}).finally(()=>clearTimeout(t));
    }

    // ── Key press ─────────────────────────────────────────────────────────────
    const inFlight=new Set();
    async function tap(name){
      if(inFlight.has(name))return;
      inFlight.add(name);
      try{
        const r=await fetchT('/api/key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
        if(!r.ok)toast('Error');
      }catch{toast('Not reachable');}
      finally{setTimeout(()=>inFlight.delete(name),150);}
    }
    function htap(name){haptic();tap(name);}

    // ── App launch ────────────────────────────────────────────────────────────
    async function launch(pkg){
      try{
        const r=await fetchT('/api/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pkg})});
        const d=await r.json();
        if(!r.ok)toast(d.error||'Not installed');
      }catch{toast('Not reachable');}
    }
    function hlaunch(pkg){haptic();launch(pkg);}

    // ── Volume ────────────────────────────────────────────────────────────────
    const slider=document.getElementById('vol'),volNum=document.getElementById('vol-num'),volIcon=document.getElementById('vol-icon');
    function updateSliderUI(val,max){
      const pct=max>0?(100-val/max*100).toFixed(1)+'%':'50%';
      slider.style.setProperty('--fi',pct);
      volNum.textContent=val;
      volIcon.textContent=val===0?'🔇':parseInt(val)<parseInt(max)/2?'🔉':'🔊';
    }
    function onVolInput(el){haptic();updateSliderUI(parseInt(el.value),parseInt(el.max));}
    let vt;
    function onVolChange(el){
      clearTimeout(vt);
      vt=setTimeout(()=>fetchT('/api/volume',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({level:parseInt(el.value)})}).catch(()=>{}),80);
    }
    async function initVolume(){
      try{const d=await(await fetch('/api/volume')).json();slider.max=d.max;slider.value=d.current;updateSliderUI(d.current,d.max);}catch{}
    }

    // ── Text input ────────────────────────────────────────────────────────────
    async function sendText(){
      const box=document.getElementById('txt'),text=box.value.trim();
      if(!text)return;haptic();
      try{
        const r=await fetch('/api/text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
        if(r.ok){box.value='';toast('Sent ✓');}else toast('Error');
      }catch{toast('Not reachable');}
    }
    document.getElementById('txt').addEventListener('keydown',e=>{if(e.key==='Enter')sendText();});

    // ── Status polling ────────────────────────────────────────────────────────
    const dot=document.getElementById('dot'),stlbl=document.getElementById('stlbl');
    async function poll(){
      try{
        const d=await(await fetch('/api/status')).json();
        dot.className='dot '+(d.online?'on':'off');
        stlbl.textContent=d.online?'Online':'Offline';
      }catch{dot.className='dot off';stlbl.textContent='No connection';}
    }

    // ── Toast ─────────────────────────────────────────────────────────────────
    let tt;
    function toast(msg){
      const el=document.getElementById('toast');
      el.textContent=msg;el.classList.add('show');
      clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2200);
    }

    // ── Mode toggle ───────────────────────────────────────────────────────────
    function setMode(m){
      document.getElementById('dpad-panel').style.display = m==='dpad' ? '' : 'none';
      document.getElementById('tp-panel').style.display   = m==='trackpad' ? '' : 'none';
      document.getElementById('mode-dpad').classList.toggle('active', m==='dpad');
      document.getElementById('mode-tp').classList.toggle('active', m==='trackpad');
      localStorage.setItem('mode', m);
    }
    setMode(localStorage.getItem('mode') || 'dpad');

    // ── Trackpad ──────────────────────────────────────────────────────────────
    const TP_STEP = 36;      // px of finger travel per key event
    const TP_TAP_DIST = 12;  // px max total movement to count as tap
    const TP_TAP_MS = 280;   // ms max duration to count as tap
    const TP_LP_MS = 500;    // ms hold to trigger long-press (menu)
    const TP_CD = 120;       // ms cooldown between same-direction sends

    const tpEl  = document.getElementById('tp');
    const tpDot = document.getElementById('tp-dot');
    let tpStart = null, tpLast = null, tpAccX = 0, tpAccY = 0;
    let tpLpTimer = null, tpLpFired = false;
    const tpNext = {up:0,down:0,left:0,right:0};

    function tpKey(dir){
      const now = Date.now();
      if(now < tpNext[dir]) return;
      tpNext[dir] = now + TP_CD;
      haptic(); tap(dir);
    }
    function tpCancelLp(){ clearTimeout(tpLpTimer); tpLpTimer = null; }

    tpEl.addEventListener('touchstart', e=>{
      e.preventDefault();
      const t = e.touches[0], r = tpEl.getBoundingClientRect();
      tpStart = {x:t.clientX, y:t.clientY, ms:Date.now(), r};
      tpLast  = {x:t.clientX, y:t.clientY};
      tpAccX = 0; tpAccY = 0;
      tpLpFired = false;
      tpLpTimer = setTimeout(()=>{ tpLpFired=true; haptic(); haptic(); tap('long_ok'); }, TP_LP_MS);
      tpDot.style.left = (t.clientX - r.left) + 'px';
      tpDot.style.top  = (t.clientY - r.top)  + 'px';
      tpDot.style.opacity = '1';
    },{passive:false});

    tpEl.addEventListener('touchmove', e=>{
      e.preventDefault();
      const t = e.touches[0];
      tpAccX += t.clientX - tpLast.x;
      tpAccY += t.clientY - tpLast.y;
      tpLast = {x:t.clientX, y:t.clientY};
      tpDot.style.left = (t.clientX - tpStart.r.left) + 'px';
      tpDot.style.top  = (t.clientY - tpStart.r.top)  + 'px';
      // cancel long-press the moment the finger moves enough to be a swipe
      if(tpLpTimer){
        const dx=t.clientX-tpStart.x, dy=t.clientY-tpStart.y;
        if(Math.hypot(dx,dy) > TP_TAP_DIST) tpCancelLp();
      }
      while(tpAccX >=  TP_STEP){ tpKey('right'); tpAccX -= TP_STEP; }
      while(tpAccX <= -TP_STEP){ tpKey('left');  tpAccX += TP_STEP; }
      while(tpAccY >=  TP_STEP){ tpKey('down');  tpAccY -= TP_STEP; }
      while(tpAccY <= -TP_STEP){ tpKey('up');    tpAccY += TP_STEP; }
    },{passive:false});

    tpEl.addEventListener('touchend', e=>{
      e.preventDefault();
      tpCancelLp();
      tpDot.style.opacity = '0';
      if(!tpStart) return;
      const dx = tpLast.x - tpStart.x, dy = tpLast.y - tpStart.y;
      if(!tpLpFired && Math.hypot(dx,dy) < TP_TAP_DIST && Date.now() - tpStart.ms < TP_TAP_MS) htap('ok');
      tpStart = null;
    },{passive:false});

    tpEl.addEventListener('touchcancel', e=>{ tpCancelLp(); tpDot.style.opacity='0'; tpStart=null; },{passive:false});

    // ── D-pad OK long press ───────────────────────────────────────────────────
    (function(){
      const btn = document.getElementById('dp-ok');
      let timer = null, fired = false;
      btn.addEventListener('touchstart', e=>{
        e.preventDefault(); // blocks the onclick so we control the action fully
        fired = false;
        timer = setTimeout(()=>{ fired=true; haptic(); haptic(); tap('long_ok'); }, 500);
      },{passive:false});
      btn.addEventListener('touchend', e=>{
        e.preventDefault();
        clearTimeout(timer);
        if(!fired) htap('ok');
      },{passive:false});
      btn.addEventListener('touchcancel', ()=>clearTimeout(timer));
    })();

    // ── Cast (photo / video → TV) ─────────────────────────────────────────────
    function openCastPicker(){
      if(document.getElementById('cast-btn').classList.contains('uploading')) return;
      document.getElementById('cast-input').click();
    }
    function onCastFile(input){
      const file = input.files[0];
      input.value = '';
      if(!file) return;
      haptic();
      const btn      = document.getElementById('cast-btn');
      const prog     = document.getElementById('cast-prog');
      const fill     = document.getElementById('cast-prog-fill');
      btn.classList.add('uploading');
      prog.style.display = '';
      fill.style.width = '0%';
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/cast');
      xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
      xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name));
      xhr.upload.onprogress = e=>{
        if(e.lengthComputable) fill.style.width = Math.round(e.loaded/e.total*100) + '%';
      };
      xhr.onload = ()=>{
        fill.style.width = '100%';
        if(xhr.status === 200){ toast('Opening on TV \u2713'); }
        else { try{ toast(JSON.parse(xhr.responseText).error||'Upload failed'); }catch{ toast('Upload failed'); } }
        setTimeout(()=>{ prog.style.display='none'; btn.classList.remove('uploading'); }, 1200);
      };
      xhr.onerror = xhr.ontimeout = ()=>{
        toast('Not reachable');
        prog.style.display='none'; btn.classList.remove('uploading');
      };
      xhr.timeout = 120000; // 2 min — enough for a ~200 MB video on LAN
      xhr.send(file);
    }

    // ── Multiple TV support ───────────────────────────────────────────────────
    var DEFAULT_HOST = window.location.host; // e.g. 192.168.1.6:8765
    var activeHost = localStorage.getItem("tvhome_active") || DEFAULT_HOST;

    function baseUrl(){ return "http://" + activeHost; }

    // Patch fetchT and fetch calls to use dynamic baseUrl
    // (all /api/* calls already use relative paths — redefine fetch for them)
    var _origFetch = window.fetch.bind(window);
    window.fetch = function(url, opts) {
      if (typeof url === "string" && url.startsWith("/")) url = baseUrl() + url;
      return _origFetch(url, opts);
    };
    // Patch XHR for cast upload
    var _origXHROpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(m, url) {
      if (typeof url === "string" && url.startsWith("/")) url = baseUrl() + url;
      return _origXHROpen.apply(this, [m, url].concat(Array.prototype.slice.call(arguments, 2)));
    };

    function getTvList(){
      try{ return JSON.parse(localStorage.getItem("tvhome_tvs") || "[]"); }catch(e){ return []; }
    }
    function saveTvList(list){ localStorage.setItem("tvhome_tvs", JSON.stringify(list)); }

    function openTvModal(){
      renderTvList();
      document.getElementById("tv-modal").classList.add("open");
    }
    function closeTvModal(){ document.getElementById("tv-modal").classList.remove("open"); }

    function renderTvList(){
      var list = getTvList();
      var el = document.getElementById("tv-list");
      // Always include this TV
      var all = [{name:"This TV", ip: DEFAULT_HOST}].concat(list.filter(function(t){ return t.ip !== DEFAULT_HOST; }));
      el.innerHTML = all.map(function(tv, i){
        var active = tv.ip === activeHost;
        var del = i > 0 ? '<button class="tv-del" onclick="removeTv('+i+')">&#x2715;</button>' : "";
        return '<div class="tv-item'+(active?" selected":"")+'" onclick="switchTv(\"'+tv.ip+'\")">'  
          + '<div class="tv-dot'+(active?" on":"")+'"></div>'  
          + '<div><div class="tv-name">'+tv.name+'</div><div class="tv-ip">'+tv.ip+'</div></div>'  
          + del + "</div>";
      }).join("");
    }

    function switchTv(ip){
      activeHost = ip;
      localStorage.setItem("tvhome_active", ip);
      closeTvModal();
      poll(); initVolume();
      toast("Switched to " + ip.split(":")[0]);
    }

    function addTv(){
      var name = document.getElementById("tv-name-in").value.trim();
      var ip   = document.getElementById("tv-ip-in").value.trim();
      if (!name || !ip) { toast("Enter name and IP"); return; }
      if (!ip.includes(":")) ip = ip + ":8765";
      var list = getTvList();
      if (!list.find(function(t){ return t.ip === ip; })) { list.push({name:name, ip:ip}); saveTvList(list); }
      document.getElementById("tv-name-in").value = "";
      document.getElementById("tv-ip-in").value = "";
      renderTvList();
    }

    function removeTv(idx){
      var list = getTvList();
      // idx 0 = "This TV" which is not in the stored list, so stored list index = idx-1
      list.splice(idx - 1, 1);
      saveTvList(list);
      if (activeHost === list[idx-1] && activeHost !== DEFAULT_HOST) switchTv(DEFAULT_HOST);
      renderTvList();
    }

    // ── Sleep timer ───────────────────────────────────────────────────────────
    var SLEEP_OPTIONS = [0, 30, 60, 90]; // minutes; 0 = off
    var sleepIdx = 0;
    var sleepCountdown = null;

    function cycleSleep(){
      haptic();
      sleepIdx = (sleepIdx + 1) % SLEEP_OPTIONS.length;
      var mins = SLEEP_OPTIONS[sleepIdx];
      fetchT("/api/sleep", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({minutes:mins})}, 4000)
        .then(function(){ updateSleepBtn(mins * 60); })
        .catch(function(){ toast("Not reachable"); });
    }

    function updateSleepBtn(remaining){
      var btn = document.getElementById("sleep-btn");
      var lbl = document.getElementById("sleep-label");
      if (sleepCountdown) { clearInterval(sleepCountdown); sleepCountdown = null; }
      if (remaining <= 0 || sleepIdx === 0) {
        btn.classList.remove("active"); lbl.textContent = "Sleep off"; sleepIdx = 0;
      } else {
        btn.classList.add("active");
        var end = Date.now() + remaining * 1000;
        function tick(){
          var s = Math.round((end - Date.now()) / 1000);
          if (s <= 0) { btn.classList.remove("active"); lbl.textContent = "Sleep off"; sleepIdx = 0; clearInterval(sleepCountdown); return; }
          var m = Math.floor(s/60), sec = s%60;
          lbl.textContent = "Sleep " + m + ":" + (sec<10?"0":"") + sec;
        }
        tick();
        sleepCountdown = setInterval(tick, 1000);
      }
    }

    function syncSleepState(){
      fetchT("/api/sleep", {}, 3000).then(function(r){ return r.json(); })
        .then(function(d){
          if (d.remaining > 0) {
            // Figure out which slot we are in
            var mins = Math.ceil(d.remaining / 60);
            for (var i = 0; i < SLEEP_OPTIONS.length; i++) { if (SLEEP_OPTIONS[i] >= mins) { sleepIdx = i; break; } }
            updateSleepBtn(d.remaining);
          }
        }).catch(function(){});
    }

    // ── Voice search ────────────────────────────────────────────────────────────
    function startVoice(){
      haptic();
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!SR){
        toast('Tap 🎤 on keyboard to dictate');
        document.getElementById('txt').focus();
        return;
      }
      var btn = document.getElementById('mic-btn');
      if(btn.classList.contains('listening')) return;
      var sr = new SR();
      sr.lang = 'en-US';
      sr.interimResults = false;
      sr.maxAlternatives = 1;
      btn.classList.add('listening');
      toast('Listening…');
      sr.onresult = function(e){
        var text = e.results[0][0].transcript.trim();
        if(text){ document.getElementById('txt').value = text; sendText(); }
      };
      sr.onerror = function(){ toast('Mic unavailable — use keyboard mic'); document.getElementById('txt').focus(); };
      sr.onend = function(){ btn.classList.remove('listening'); };
      sr.start();
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    poll();initVolume();syncSleepState();setInterval(poll,15000);
  </script>
</body>
</html>
